<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether PVP Overlay</title>
    <link rel="stylesheet" href="../meter/style.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="meter-pvp">
    <div class="title-bar">
      <div class="title-bar__drag" id="drag-handle" data-tauri-drag-region>
        <span class="title-bar__label">AETHER PVP</span>
      </div>
      <button class="title-bar__close" id="close-btn" title="Close overlay">&times;</button>
    </div>
    <div class="pvp-content" id="pvp-content">
      <div class="pvp-section-title pvp-section-title--stats">
        <span>Kill stats</span>
        <span class="pvp-section-title__line"></span>
        <button class="pvp-stats-clear" id="pvp-stats-clear" type="button" title="Clear combat stats">
          Clear
        </button>
        <span
          class="pvp-help"
          tabindex="0"
          aria-label="Passive capture only: targets too far away cannot be counted, and damage settles when the target dies."
        >
          ?
        </span>
      </div>
      <div class="pvp-combat-stats">
        <div class="pvp-combat-stats__header">
          <span>Player</span>
          <button type="button" id="pvp-sort-damage">Damage</button>
          <button type="button" id="pvp-sort-kills">Kills</button>
          <span>Assists</span>
          <span>Deaths</span>
        </div>
        <div class="pvp-combat-stats__empty" id="pvp-combat-stats-empty">No combat stats yet</div>
        <div class="pvp-combat-stats__list" id="pvp-combat-stats-list"></div>
      </div>
      <section class="pvp-damage-section" id="pvp-dealt-section">
        <div class="pvp-section-title">Damage dealt</div>
        <div class="pvp-empty">No damage dealt yet</div>
        <div class="player-list" id="pvp-dealt-player-list"></div>
      </section>
      <section class="pvp-damage-section" id="pvp-received-section">
        <div class="pvp-section-title">Damage taken</div>
        <div class="pvp-empty">No damage taken yet</div>
        <div class="player-list" id="pvp-received-player-list"></div>
      </section>
      <div class="player-hp-panel">
        <div class="pvp-section-title">Player HP watch</div>
        <div class="player-hp-list" id="player-hp-list"></div>
        <form class="player-hp-form" id="player-hp-form">
          <input
            class="player-hp-input"
            id="player-hp-input"
            type="text"
            list="player-hp-suggestions"
            autocomplete="off"
            spellcheck="false"
            placeholder="Add a player to watch"
          />
          <datalist id="player-hp-suggestions"></datalist>
          <button class="player-hp-add" type="submit">+</button>
        </form>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
