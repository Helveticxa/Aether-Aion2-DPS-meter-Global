<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether DPS Overlay</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- One rounded card. The header carries what you are fighting and the
         fight time; its buttons only appear while the pointer is over the
         card, so a fight shows numbers and nothing else. -->
    <div class="card" id="card">
      <header class="head" id="drag-handle">
        <span class="head__dot" id="live-dot" aria-hidden="true"></span>
        <span class="head__title" id="head-title">Aether</span>
        <!-- Capsule mode: your own figures, in the one line that is left. -->
        <span class="head__you" id="head-you"></span>

        <span class="head__meta">
          <span class="head__idle">Waiting for a fight</span>
          <span class="head__hp" id="head-hp"></span>
          <span class="head__time" id="status-fight-time"></span>
        </span>

        <span class="head__actions">
          <button class="icon-btn" id="reset-btn" title="Reset">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
            </svg>
          </button>
          <button class="icon-btn" id="history-btn" title="History">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 7v14" />
              <path
                d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"
              />
            </svg>
          </button>
          <button class="icon-btn" id="settings-btn" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
          <button class="icon-btn" id="compact-btn" title="Capsule mode" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 20 5-5 5 5" />
              <path d="m7 4 5 5 5-5" />
            </svg>
          </button>
          <button class="icon-btn" id="pin-btn" title="Always on top" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 17v5" />
              <path
                d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"
              />
            </svg>
          </button>
          <button class="icon-btn icon-btn--close" id="close-btn" title="Close overlay">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18" />
              <path d="m6 6 12 12" />
            </svg>
          </button>
        </span>
      </header>

      <div class="hp" id="boss-row" hidden>
        <div class="hp__fill" id="boss-row-bar"></div>
      </div>

      <main class="body" id="scaled-overlay">
        <div class="diag-message" id="diag-message"></div>
        <!-- After a boss: how the fight went. Built by main.js; takes the
             list's place until dismissed or the next boss. -->
        <section class="summary" id="summary" hidden></section>
        <div class="player-list" id="player-list"></div>
      </main>

      <footer class="foot" id="status-bar">
        <span class="foot__party" id="party-dps"></span>
        <span class="foot__pb" id="pb-chip" title="Your DPS against your best on this boss"></span>
        <span class="foot__tools">
          <button class="text-btn" id="copy-report-btn" title="Copy combat report">Copy</button>
          <button class="text-btn" id="pvp-btn" title="Open PVP meter">PvP</button>
          <span class="foot__sys" id="status-cpu" title="CPU in use on this PC"></span>
          <span class="foot__sys" id="status-mem" title="Memory in use on this PC"></span>
        </span>
        <span class="foot__ping" id="status-ping"></span>
      </footer>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
